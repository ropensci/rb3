id: b3-trade-information-consolidated
filename: ~
filetype: CUSTOM
description: Negócios consolidados do pregão (TradeInformationConsolidated), todos os segmentos, últimos ~360 pregões
downloader:
  function: trade_information_download
  url: https://arquivos.b3.com.br/api/download/requestname?fileName=TradeInformationConsolidated
  verifyssl: true
  format: csv
  args:
    refdate: Data de referência
reader:
  function: trade_information_read
writers:
  input:
    partition: refdate
fields:
- name: refdate
  description: Data de referência
  type: date
- name: symbol
  description: Código de negociação do instrumento
  type: character
- name: isin
  description: Código ISIN
  type: character
- name: segment
  description: Segmento
  type: character
- name: low
  description: Preço mínimo
  type: number
- name: high
  description: Preço máximo
  type: number
- name: average
  description: Preço médio
  type: number
- name: close
  description: Último preço
  type: number
- name: oscillation
  description: Oscilação (%)
  type: number
- name: adjusted_quote
  description: Preço de ajuste
  type: number
- name: adjusted_tax
  description: Taxa de ajuste
  type: number
- name: reference_price
  description: Preço de referência
  type: number
- name: transactions_quantity
  description: Quantidade de negócios
  type: number
- name: traded_contracts
  description: Quantidade de contratos negociados
  type: number
- name: volume
  description: Volume financeiro (R$)
  type: number
