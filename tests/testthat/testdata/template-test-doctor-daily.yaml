id: template-test-doctor-daily
filename: ~
filetype: CUSTOM
description: Test template for the cache doctor (daily)
calendar: Brazil/BMF
downloader:
  function: datetime_download
  url: https://example.com/%Y%m%d
  format: csv
  args:
    refdate: Data de referência
reader:
  function: csv_read_file
writers:
